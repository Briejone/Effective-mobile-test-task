version: '3.8'

services:
  backend:
    build: ./backend
    container_name: effective-backend
    networks:
      - app-network
    expose:
      - ${BACKEND_PORT}
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  nginx:
    image: nginx:stable-alpine
    container_name: effective-nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 64M

networks:
  app-network:
    driver: bridge